<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash-MoE Chat</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
<!-- Optional SF Pro Font equivalent if system font isn't explicitly triggering enough Apple flavor -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- Sidebar -->
  <aside class="sidebar" :class="{ collapsed: !sidebarOpen }">
    <div class="sidebar-header">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Flash-MoE
      </h2>
    </div>
    <button class="new-chat-btn" @click="newChat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
    <div class="chat-list">
      <div v-for="chat in sortedChats" :key="chat.id"
        class="chat-list-item" :class="{ active: chat.id === activeChatId }"
        @click="selectChat(chat.id)">
        <span class="title">{{ chat.title }}</span>
        <button class="delete-btn" @click.stop="deleteChat(chat.id)" title="Delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="sidebar-settings">
      <label>API Base URL</label>
      <input v-model="settings.baseUrl" placeholder="http://localhost:8080" @change="checkHealth" />
      <label>Authorization</label>
      <input v-model="settings.authHeader" placeholder="Bearer sk-..." type="password" />
      <label>System Prompt</label>
      <textarea class="sidebar-sysprompt" v-model="settings.systemPrompt"
        placeholder="You are a helpful assistant..." @change="persistSettings"></textarea>
      <div class="status-line">
        <span class="status-dot" :class="connectionStatus"></span>
        {{ connectionLabel }}
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main">
    <div class="topbar">
      <button class="toggle-sidebar-btn" @click="sidebarOpen = !sidebarOpen" title="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <span class="topbar-title">{{ activeChat?.title || 'Flash-MoE Chat' }}</span>
      <span v-if="modelName" class="topbar-model">{{ modelName }}</span>
      <button class="gear-btn" @click="showSettings = true" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="messages-wrapper" ref="messagesWrapper">
      <div class="messages-container">
        <div v-if="!activeChat || activeChat.messages.length === 0" class="welcome">
          <svg class="welcome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="var(--accent)" stroke="var(--accent)"/></svg>
          <h1>Flash-MoE Chat</h1>
          <p>Running massive MoE models natively. Type a message to begin.</p>
        </div>

        <!-- Messages list -->
        <div v-for="(msg, idx) in displayMessages" :key="idx" class="message" :class="msg.role">
          <div class="message-avatar">
            <span v-if="msg.role === 'user'">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
          <div class="message-body">
            <div class="message-role">{{ msg.role === 'user' ? 'You' : 'Assistant' }}</div>

            <!-- Edit mode -->
            <div v-if="editingIdx === idx" class="edit-area">
              <textarea class="edit-textarea" v-model="editText" rows="3"></textarea>
              <div class="edit-actions">
                <button class="btn btn-primary btn-sm" @click="saveEdit(idx)">Save</button>
                <button class="btn btn-secondary btn-sm" @click="cancelEdit">Cancel</button>
              </div>
            </div>

            <!-- Display mode -->
            <template v-else>
              <div v-if="msg.error" class="message-error">{{ msg.error }}</div>
              <div v-else-if="msg.role === 'assistant'"
                class="message-content"
                :class="{ 'streaming-cursor': isStreaming && idx === displayMessages.length - 1 && !isThinkingOnly(msg.content) }"
                v-html="renderMarkdown(msg.content)"></div>
              <div v-else class="message-content">{{ msg.content }}</div>

              <!-- Action buttons -->
              <div class="msg-actions" :class="{ hidden: isStreaming }">
                <button class="msg-action-btn" @click="startEdit(idx)" title="Edit">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button v-if="msg.role === 'assistant'" class="msg-action-btn" @click="regenerate(idx)" title="Regenerate">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button v-if="msg.role === 'assistant' && msg.content" class="msg-action-btn" @click="continueResponse(idx)" title="Continue">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="msg-action-btn msg-action-delete" @click="deleteMessage(idx)" title="Delete from here">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </button>
              </div>

              <!-- Usage stats -->
              <div v-if="msg.usage" class="message-stats">
                <span v-if="msg.usage.cached_tokens > 0" class="stat-badge cache-badge" title="Tokens reused from KV cache">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 13 9 20 9"/><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
                  {{ msg.usage.cached_tokens }} cached
                </span>
                <span class="stat-badge">{{ msg.usage.prompt_tokens }} prompt</span>
                <span class="stat-badge">{{ msg.usage.completion_tokens }} completion</span>
                <span class="stat-badge total-badge">{{ msg.usage.total_tokens || (msg.usage.prompt_tokens + msg.usage.completion_tokens) }} total</span>
                <span v-if="msg.usage.prefill_tokens_per_second > 0" class="stat-badge speed-badge" title="Prefill speed">⇡ {{ msg.usage.prefill_tokens_per_second.toFixed(1) }} t/s</span>
                <span v-if="msg.usage.decode_tokens_per_second > 0" class="stat-badge speed-badge" title="Decode speed">⇣ {{ msg.usage.decode_tokens_per_second.toFixed(1) }} t/s</span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-container">
        <div class="input-box">
          <textarea ref="inputEl" v-model="userInput" @keydown="handleKeydown" @input="autoResize"
            placeholder="Send a message..." rows="1"></textarea>
          <button v-if="isStreaming" class="send-btn stop-btn" @click="stopStreaming" title="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button v-else class="send-btn" :disabled="!userInput.trim() || isLoading" @click="sendMessage" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
        <div class="input-footer">
          <div class="input-toggles">
            <button class="think-toggle-btn" :class="{ active: settings.thinkingEnabled }"
              @click="settings.thinkingEnabled = !settings.thinkingEnabled; persistSettings()"
              :title="settings.thinkingEnabled ? 'Thinking enabled' : 'Thinking disabled'">
              Think
            </button>
            <button class="think-toggle-btn" :class="{ active: settings.cacheEnabled }"
              @click="settings.cacheEnabled = !settings.cacheEnabled; persistSettings()"
              :title="settings.cacheEnabled ? 'KV cache enabled' : 'KV cache disabled'">
              KV Cache
            </button>
            <button class="think-toggle-btn" :class="{ active: settings.minTokensEnabled }"
              @click="settings.minTokensEnabled = !settings.minTokensEnabled; persistSettings()"
              :title="settings.minTokensEnabled ? 'Min tokens: ' + settings.minTokens : 'Min tokens disabled'">
              Min {{ settings.minTokensEnabled ? settings.minTokens : '' }}
            </button>
          </div>
          <span class="input-hint">Return to send &middot; Shift+Return for line break</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div v-if="showSettings" class="modal-overlay" @click.self="showSettings = false">
    <div class="modal">
      <h3>Settings</h3>
      <label>API Base URL</label>
      <input v-model="settings.baseUrl" placeholder="http://localhost:8080" />
      <label>Authorization Header</label>
      <input v-model="settings.authHeader" placeholder="Bearer sk-..." />
      <label>Model (optional override)</label>
      <input v-model="settings.model" placeholder="auto-detect" />
      <label>System Prompt</label>
      <textarea v-model="settings.systemPrompt" placeholder="You are a helpful assistant..."></textarea>
      <div class="params-row">
        <div class="param-group">
          <label>Temperature: {{ settings.temperature.toFixed(1) }}</label>
          <input type="range" v-model.number="settings.temperature" min="0" max="2" step="0.1" />
        </div>
        <div class="param-group">
          <label>Top P: {{ settings.topP.toFixed(1) }}</label>
          <input type="range" v-model.number="settings.topP" min="0" max="1" step="0.05" />
        </div>
        <div class="param-group">
          <label>Max Tokens: {{ settings.maxTokens }}</label>
          <input type="range" v-model.number="settings.maxTokens" min="64" max="32768" step="64" />
        </div>
        <div class="param-group">
          <label>
            Min Tokens: {{ settings.minTokensEnabled ? settings.minTokens : 'off' }}
            <span class="param-toggle" :class="{ active: settings.minTokensEnabled }"
              @click="settings.minTokensEnabled = !settings.minTokensEnabled">&bull;</span>
          </label>
          <input type="range" v-model.number="settings.minTokens" min="0" max="8192" step="64"
            :disabled="!settings.minTokensEnabled" />
        </div>
        <div class="param-group">
          <label>Freq Penalty: {{ settings.frequencyPenalty.toFixed(1) }}</label>
          <input type="range" v-model.number="settings.frequencyPenalty" min="-2" max="2" step="0.1" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" @click="showSettings = false">Cancel</button>
        <button class="btn btn-primary" @click="saveSettings">Save Changes</button>
      </div>
    </div>
  </div>
</div>
<style>
  [v-cloak] { display: none; }
</style>
<script src="/static/app.js"></script>
</body>
</html>
